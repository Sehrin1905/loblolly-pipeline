[cache]
# Local directory where R2 data will be synced to
local_cache_dir = "/scratch/username/loblolly-cache"

[pipeline]
# Process these samples (leave empty to process all)
samples = []

# Resize factor for mosaics before segmentation
mosaic_resize_factor = 0.5

[cellpose]
# Use GPU if available
use_gpu = true
# Cell diameter (None = auto-detect)
diameter = null

[r2]
bucket_name = "loblolly-pipeline"
