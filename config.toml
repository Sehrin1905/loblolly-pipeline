[cache]
#local_cache_dir is set via LOBLOLLY_CACHE_DIR environment variable at runtime
#On Pegasus: export LOBLOLLY_CACHE_DIR=/scratch/shossain/loblolly-cache
#On Mac: export LOBLOLLY_CACHE_DIR=/tmp/loblolly-cache

[pipeline]
# Start with one explicitly named sample. Empty selects all validated manifests.
samples = ["REF_636_RECENT"]
mosaic_resize_factor = 1.0
# Guardrails, not measured peak-RAM requirements. Additional workspaces need more RAM.
max_input_gb = 2.0
max_analysis_pixels = 25000000
# Optional proximity graph, not cell-wall adjacency or interface lengths.
# adjacency_radius_um = 1.0
# Explicit, reviewed biology; needed for comparative plots. See samples.example.json.
# sample_registry = "samples.json"

[cellpose]
use_gpu = true

[r2]
bucket_name = "sehrin-image-stitching"
