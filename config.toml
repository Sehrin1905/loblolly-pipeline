[cache]
# Local directory where R2 data will be synced to
# On Pegasus use your scratch directory e.g. /scratch/shossain/loblolly-cache
local_cache_dir = "/scratch/loblolly-cache"

[pipeline]
# Process these samples (leave empty to process all)
samples = []

# Resize factor for mosaics before segmentation
mosaic_resize_factor = 0.5

[cellpose]
# Use GPU if available
use_gpu = true
# diameter is optional - omit to auto-detect, or set a number e.g. 30.0
# diameter = 30.0

[r2]
bucket_name = "sehrin-image-stitching"
