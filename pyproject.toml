[project]
name = "loblolly-pipeline"
version = "0.1.0"
description = "Classical CV + Cellpose pipeline for detecting and classifying tracheids in Loblolly pine cross-sections"
readme = "README.md"
authors = [
    { name = "Sehrin Hossain", email = "sehrinhossain@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.92",
    "cellpose>=4.2.1.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "scikit-image>=0.26.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
