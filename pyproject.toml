[project]
name = "loblolly-pipeline"
version = "0.2.0"
description = "Calibrated microscopy stitching and exploratory lumen analysis"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.43.92", "python-dotenv>=1.2.3", "numpy>=2.5.2",
  "opencv-python-headless>=5.0.0.93", "pandas>=3.0.5", "scikit-image>=0.26.0",
  "scipy>=1.18.1", "tifffile>=2026.9.15", "matplotlib>=3.10", "filelock>=3.20",
]

[project.optional-dependencies]
inference = ["cellpose==4.2.1.1", "torch==2.13.0", "torchvision==0.28.0"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]

[tool.uv.sources]
torch = [{index = "pytorch-cu126", marker = "sys_platform == 'linux'", extra = "inference"}]
torchvision = [{index = "pytorch-cu126", marker = "sys_platform == 'linux'", extra = "inference"}]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["wood_stitch", "loblolly_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
